name: ReadAlong
options:
  bundleIdPrefix: com.sharathkrml
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83JSBLYT7Z
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ReadAlong:
    type: application
    platform: macOS
    sources:
      - path: ReadAlong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharathkrml.readalong
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: ReadAlong/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Read Along
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: Read Along listens to your microphone only while a reading session is active.

  ReadAlongTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ReadAlongTests
    dependencies:
      - target: ReadAlong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharathkrml.readalong.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReadAlong.app/Contents/MacOS/ReadAlong"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ReadAlong:
    build:
      targets:
        ReadAlong: all
        ReadAlongTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReadAlongTests
